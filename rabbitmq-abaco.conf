## Abaco overrides for RabbitMQ 3.12, mounted by docker-compose.yml as
## /etc/rabbitmq/conf.d/20-abaco.conf (the image's own 10-defaults.conf still loads).
## Production brokers need the same setting.

## Delivery acknowledgement timeout. 3.12 defaults to 30 minutes: a delivery left
## unacked longer than that closes the consumer's channel and REQUEUES the message, so
## any execution running past 30 minutes would be redelivered and run again (workers
## ack an actor message only after its execution finishes). 3.6.12 had no such limit.
## 7 days, in milliseconds. worker_max_run_time is unlimited by default, so an execution
## running longer than this is still redelivered: raise it, or disable the timeout
## entirely with an advanced.config entry [{rabbit, [{consumer_timeout, undefined}]}].
consumer_timeout = 604800000
