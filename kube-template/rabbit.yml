
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actors-rabbit
spec:
  selector:
    matchLabels:
      app: actors-rabbit
  template:
    metadata:
      labels:
        app: actors-rabbit
    spec:
      containers:
      - name: actors-rabbit
        image: rabbitmq:3.12.14-management
        ports:
        - name: rabbit
          containerPort: 5672
        - name: rabbit2
          containerPort: 15672
        env:
        - name: RABBITMQ_NODENAME
          value: "abaco-rabbit"
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          # consumer_timeout 7d (3.12 default 30min requeues long executions); see rabbitmq-abaco.conf
          value: "+A 128 -rabbit consumer_timeout 604800000"
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: tapis-abaco-secrets
              key: rabbitmq-password
